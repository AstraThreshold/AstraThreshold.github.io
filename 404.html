<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>大雅之堂。</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <!-- font-preloads -->
  <style>
    html[data-fonts-loading] body { visibility: hidden; }
    html[data-fonts-loading] .brand { visibility: visible; }
  </style>
  <script>
    (() => {
      const root = document.documentElement;
      let theme;
      try { theme = localStorage.getItem('wooolab-theme'); } catch { /* Storage is optional. */ }
      root.dataset.theme = ['light', 'dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.style.colorScheme = root.dataset.theme;
      root.style.backgroundColor = root.dataset.theme === 'dark' ? '#292522' : '#f8f5f1';
      if (!document.fonts) return;
      root.dataset.fontsLoading = '';
      addEventListener('DOMContentLoaded', () => {
        const reveal = () => { delete root.dataset.fontsLoading; root.style.removeProperty('background-color'); root.style.removeProperty('color-scheme'); };
        document.fonts.ready.then(reveal, reveal);
      }, { once: true });
    })();
  </script>
  <link rel="stylesheet" href="/assets/fonts/pingfang.css">
  <link rel="stylesheet" href="/assets/fonts/latin.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="error-page">
    <a class="brand" href="/"><img src="/assets/brand/wooolab-dark.svg" alt="WoooLAB" width="130" height="16"></a>
    <h1>Page not found.</h1>
    <p>页面不存在，或已移动。<br>This page does not exist or has moved.</p>
    <a href="/">返回主页 / Back home ↗</a>
  </main>
</body>
</html>
